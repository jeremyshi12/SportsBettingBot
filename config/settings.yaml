# ============================================================
# AI Dual-Regime Rebound Trading System — Configuration
# ============================================================

kalshi:
  # REST API
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  # WebSocket
  ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
  # Auth — set via environment variables or fill in here
  api_key: "${KALSHI_API_KEY}"
  private_key_path: "${KALSHI_PRIVATE_KEY_PATH}"
  # Rate limiting
  requests_per_second: 10

trading:
  # SAFETY: must be explicitly set to false for live trading
  dry_run: true
  # Sports to track
  sports:
    - "NCAAB"   # college basketball
    - "ATP"     # ATP tennis
  # Position sizing
  default_stake_usd: 1.00
  max_stake_usd: 10.00
  initial_bankroll_usd: 100.00
  # Portfolio limits
  max_concurrent_positions: 10
  daily_loss_limit_usd: 50.00
  max_loss_per_trade_usd: 10.00
  # Minimum expected net return per dollar staked, after fees, to trade.
  min_expected_return: 0.0

# Kelly Criterion position sizing
kelly:
  enabled: true
  fraction: 0.25             # fraction of full Kelly (conservative)
  loss_fraction: 0.50        # fraction of stake lost at the stop (partial-loss Kelly)
  require_calibrated_p: true # refuse to size on a non-probability
  max_bet_fraction: 0.05     # max 5% of bankroll per bet
  min_bet_usd: 0.50
  bankroll_floor_fraction: 0.10  # always keep 10% in reserve

# Advanced risk management
risk:
  trailing_stop_pct: 0.40      # trail by 40% of gain
  max_drawdown_pct: 0.25       # max 25% drawdown before scaling down
  drawdown_scale_factor: 0.50  # reduce to 50% sizing at max drawdown
  volatility_scaling: true     # adjust sizing by market regime

# Default parameter ranges (overridden by ML models at runtime)
non_cross:
  entry_prob_low: 0.01
  entry_prob_high: 0.05
  op_threshold: 5.0
  exit_multiplier: 6.0
  min_time_remaining_frac: 0.20

cross:
  start_prob_low: 0.60
  start_prob_high: 1.00
  collapse_prob_low: 0.03
  collapse_prob_high: 0.20
  s_threshold: 4.0
  exit_multiplier: 10.0
  exit_strategy: "multiplier"   # "full_hold" | "multiplier" | "dynamic"
  min_time_remaining_frac: 0.20

ml:
  models_dir: "src/ml/models"
  regime_classifier: "regime_classifier.joblib"
  non_cross_model: "non_cross_params.joblib"
  cross_model: "cross_params.joblib"
  # Training
  train_test_split: [0.70, 0.15, 0.15]
  chronological_split: true   # never shuffle time series into train/test
  # Ensemble (set to false to use single XGBoost)
  use_ensemble: true

  # Purged, embargoed walk-forward. Triple-barrier labels span multiple bars,
  # so overlapping label windows must be purged out of the training fold.
  cv:
    n_splits: 5
    embargo_frac: 0.01
    min_train_size: 50

  # SYNTHETIC DATA IS FOR PIPELINE TESTS ONLY. The generator plants the exact
  # pattern the strategy looks for, so any performance figure from it measures
  # the generator. reports/legacy/ has the result this produced.
  synthetic_samples: 10000

# Labelling (see src/ml/labeling.py)
labels:
  target_multiple: 2.0        # profit barrier, as a multiple of entry
  stop_multiple: 0.5          # stop barrier
  max_horizon_bars: 24        # time barrier
  intrabar_policy: "conservative"   # "conservative" | "optimistic" | "close_only"

# Market regime detection
market_regime:
  enabled: true
  low_vol_percentile: 0.30
  high_vol_percentile: 0.70
  vol_window: 20
  use_hmm: true    # requires hmmlearn package

# Backtesting
backtest:
  initial_bankroll: 100.0
  monte_carlo_sims: 1000
  walk_forward_folds: 5

  # Execution assumptions. `transaction_cost_pct: 0.01` was removed: it
  # charged 1% of realised P&L once per round trip, whereas Kalshi charges
  # ceil(0.07 * contracts * price * (1 - price)) on notional, per order, on
  # both legs. See src/backtest/costs.py.
  slippage_ticks: 0.0        # extra cents paid beyond the touch
  max_participation: 0.10    # cap size at this fraction of the bar's volume
  max_relative_spread: 1.0   # reject quotes wider than 100% of mid

# Kalshi fee schedule
fees:
  taker_rate: 0.07           # 0.035 on a small set of financial series
  maker_rate: 0.0            # 0.0025 on the series that charge it
  round_up_to_cent: true     # per order -- punitive on 1-5c contracts

storage:
  db_path: "data/trading.db"

logging:
  level: "INFO"
  log_file: "data/trading.log"
  max_bytes: 10485760   # 10 MB
  backup_count: 5

# Data quality gates applied when building the research panel.
# Every gate is enforced and counted; nothing is silently filled.
panel:
  require_two_sided_quote: true   # a one-sided quote cannot be filled
  max_spread: 0.10                # drop bars quoted wider than 10c
  require_settlement: true        # need a realised outcome to score against
  min_bars_per_market: 8
  # kinds: [game_winner]          # uncomment to restrict the universe

# Live trading only. Sentiment is a live web lookup; computing it while
# replaying history scores past markets against today's news.
features:
  allow_live_sentiment: false
